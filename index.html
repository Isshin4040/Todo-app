<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f4f6;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .app {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 24px;
      align-self: flex-start;
    }
    h1 { margin: 0 0 16px; font-size: 22px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }
    input[type="text"]:focus { outline: 2px solid #6366f1; border-color: transparent; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 14px;
    }
    .add { background: #6366f1; color: #fff; padding: 0 18px; font-weight: 600; }
    .add:hover { background: #4f46e5; }
    .filters { display: flex; gap: 6px; margin-bottom: 12px; }
    .filters button { background: #e5e7eb; padding: 6px 12px; }
    .filters button.active { background: #1f2937; color: #fff; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #f0f0f0;
    }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    li span { flex: 1; word-break: break-all; }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    /* 優先度セレクト（追加フォームと各行で共通） */
    select.prio {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      padding: 6px 4px;
      cursor: pointer;
      background: #fff;
    }
    li select.prio { font-weight: 600; border-width: 0; padding: 4px 6px; }
    select.prio-high { color: #b91c1c; background: #fee2e2; }
    select.prio-mid { color: #92400e; background: #fef3c7; }
    select.prio-low { color: #1e40af; background: #dbeafe; }
    li.done select.prio { opacity: 0.5; }
    li input.edit-input { flex: 1; padding: 6px 8px; font-size: 16px; }
    .edit { background: transparent; color: #6366f1; padding: 4px 8px; }
    .edit:hover { background: #eef2ff; }
    .del { background: transparent; color: #ef4444; padding: 4px 8px; }
    .del:hover { background: #fee2e2; }
    .empty { text-align: center; color: #9ca3af; padding: 24px 0; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
    }
    .clear { background: transparent; color: #6b7280; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STORAGE_KEY = "todo-tasks";
    const FILTERS = { all: "すべて", active: "未完了", done: "完了" };

    // 優先度（表示ラベルと並び順。小さいほど上に表示）
    const PRIORITIES = { high: "高", mid: "中", low: "低" };
    const PRIORITY_ORDER = { high: 0, mid: 1, low: 2 };

    // localStorage から読み込む（失敗時は空配列）
    // 優先度を持たない古いデータは「中」として扱う
    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        return saved.map((t) => ({
          ...t,
          priority: t.priority in PRIORITIES ? t.priority : "mid",
        }));
      } catch {
        return [];
      }
    }

    // 優先度を選ぶセレクト
    function PrioritySelect({ value, onChange }) {
      return (
        <select
          className={"prio prio-" + value}
          value={value}
          onChange={(e) => onChange(e.target.value)}
          aria-label="優先度"
        >
          {Object.entries(PRIORITIES).map(([key, label]) => (
            <option key={key} value={key}>{label}</option>
          ))}
        </select>
      );
    }

    function App() {
      const [tasks, setTasks] = useState(loadTasks);
      const [text, setText] = useState("");
      const [filter, setFilter] = useState("all");
      // 新規タスクに付ける優先度（連続で追加しやすいよう、追加後も保持）
      const [newPriority, setNewPriority] = useState("mid");
      // 編集中のタスク { id, text }（編集していないときは null）
      const [editing, setEditing] = useState(null);
      // Enter / Esc で入力欄が消えたあとに onBlur が古い状態で走らないよう、最新値を ref で参照する
      const editingRef = useRef(null);
      editingRef.current = editing;

      // タスクが変わるたびに保存
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch {}
      }, [tasks]);

      const addTask = (e) => {
        e.preventDefault();
        const title = text.trim();
        if (!title) return;
        setTasks([
          ...tasks,
          { id: Date.now(), title, done: false, priority: newPriority },
        ]);
        setText("");
      };

      const changePriority = (id, priority) =>
        setTasks(tasks.map((t) => (t.id === id ? { ...t, priority } : t)));

      const toggleTask = (id) =>
        setTasks(tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));

      const deleteTask = (id) => setTasks(tasks.filter((t) => t.id !== id));

      const startEdit = (t) => setEditing({ id: t.id, text: t.title });

      const cancelEdit = () => setEditing(null);

      // 編集を保存する（空文字にした場合は元のタイトルを残す）
      const saveEdit = () => {
        const ed = editingRef.current;
        if (!ed) return;
        const title = ed.text.trim();
        if (title) {
          setTasks(tasks.map((t) => (t.id === ed.id ? { ...t, title } : t)));
        }
        setEditing(null);
      };

      const clearDone = () => setTasks(tasks.filter((t) => !t.done));

      // 優先度の高い順に表示（同じ優先度の中では追加順を保つ）
      const visible = tasks
        .filter((t) =>
          filter === "all" ? true : filter === "done" ? t.done : !t.done
        )
        .sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);
      const remaining = tasks.filter((t) => !t.done).length;

      return (
        <div className="app">
          <h1>タスク管理</h1>

          <form onSubmit={addTask}>
            <input
              type="text"
              value={text}
              onChange={(e) => setText(e.target.value)}
              placeholder="新しいタスクを入力"
              autoFocus
            />
            <PrioritySelect value={newPriority} onChange={setNewPriority} />
            <button type="submit" className="add">追加</button>
          </form>

          <div className="filters">
            {Object.entries(FILTERS).map(([key, label]) => (
              <button
                key={key}
                className={filter === key ? "active" : ""}
                onClick={() => setFilter(key)}
              >
                {label}
              </button>
            ))}
          </div>

          {visible.length === 0 ? (
            <div className="empty">タスクがありません</div>
          ) : (
            <ul>
              {visible.map((t) => (
                <li key={t.id} className={t.done ? "done" : ""}>
                  <input
                    type="checkbox"
                    checked={t.done}
                    onChange={() => toggleTask(t.id)}
                  />
                  <PrioritySelect
                    value={t.priority}
                    onChange={(p) => changePriority(t.id, p)}
                  />
                  {editing && editing.id === t.id ? (
                    <input
                      type="text"
                      className="edit-input"
                      value={editing.text}
                      autoFocus
                      onChange={(e) => setEditing({ id: t.id, text: e.target.value })}
                      onKeyDown={(e) => {
                        if (e.key === "Enter") saveEdit();
                        else if (e.key === "Escape") cancelEdit();
                      }}
                      onBlur={saveEdit}
                    />
                  ) : (
                    <>
                      <span onDoubleClick={() => startEdit(t)}>{t.title}</span>
                      <button
                        className="edit"
                        onClick={() => startEdit(t)}
                        aria-label="編集"
                      >
                        編集
                      </button>
                    </>
                  )}
                  <button
                    className="del"
                    onClick={() => deleteTask(t.id)}
                    aria-label="削除"
                  >
                    削除
                  </button>
                </li>
              ))}
            </ul>
          )}

          <div className="footer">
            <span>残り {remaining} 件</span>
            {tasks.some((t) => t.done) && (
              <button className="clear" onClick={clearDone}>完了済みを削除</button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
